name: PlatformIO Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build firmware (nanoatmega328)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # pioarduino 55.03.312 accepts Python 3.10 to 3.14 only
          python-version: '3.13'

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build
        run: pio run

      - name: Unit tests on the PC
        run: pio test -e native

      - name: Build the other boards
        run: pio run -e d1_mini -e esp32dev -e lolin_s2_mini -e esp32s3 -e esp32c3 -e esp32c6

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-nanoatmega328
          path: .pio/build/nanoatmega328/firmware.hex
          if-no-files-found: error
