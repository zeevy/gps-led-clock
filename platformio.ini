; PlatformIO Project Configuration File
; GPS Clock with 32x8 LED Matrix Display
;
; A sophisticated Arduino-based GPS clock that displays time on a 32x8 LED matrix
; with beautiful animations and effects. Features GPS time synchronization,
; animated time display, rain effect animation, and automatic brightness control.
;
; Author: zeevy
; Version: 1.0.0
; License: MIT
; Repository: https://github.com/zeevy/gps-clock-32x8

[platformio]
default_envs = nanoatmega328
description = GPS Clock with 32x8 LED Matrix Display
src_dir = src
lib_dir = lib

; Shared by every board env
[arduino]
framework = arduino
monitor_speed = 115200
lib_deps = 
	mikalhart/TinyGPSPlus@1.1.0
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit BusIO@1.17.4
	sstaub/TickTwo@4.4.0
	adafruit/RTClib@2.1.4

; ESP32 family: the pioarduino platform (Arduino core 3.3.12), because the
; official platform has only core 2.0.17 and no ESP32-C6 support
[esp32_base]
extends = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip

; Arduino Nano: GPS TX on D8, matrix DIN D11, CLK D13, CS D10
[env:nanoatmega328]
extends = arduino
platform = atmelavr@5.3.0
board = nanoatmega328
monitor_filters = default
upload_speed = 57600
lib_deps = 
	${arduino.lib_deps}
	slashdevin/NeoSWSerial@3.0.5

; Wemos D1 mini: GPS TX on D2, matrix DIN D7, CLK D5, CS D8
[env:d1_mini]
extends = arduino
platform = espressif8266@4.2.1
board = d1_mini

; ESP32 DevKit V1: GPS TX on GPIO16, matrix DIN 23, CLK 18, CS 5
[env:esp32dev]
extends = esp32_base
board = esp32doit-devkit-v1
build_flags = -D PIN_GPS_RX=16

; Lolin S2 mini: GPS TX on GPIO4, matrix DIN 11, CLK 7, CS 12
[env:lolin_s2_mini]
extends = esp32_base
board = lolin_s2_mini
build_flags = -D PIN_GPS_RX=4

; ESP32-S3 DevKitC-1: GPS TX on GPIO6, matrix DIN 11, CLK 12, CS 10.
; For an S3 super mini or zero (4 MB flash), add -D ARDUINO_USB_CDC_ON_BOOT=1,
; board_upload.flash_size = 4MB and board_build.partitions = default.csv
[env:esp32s3]
extends = esp32_base
board = esp32-s3-devkitc-1
build_flags = -D PIN_GPS_RX=6

; ESP32-C3 super mini: GPS TX on GPIO3, matrix DIN 6, CLK 4, CS 7.
; Not GPIO20: it is the UART0 RX pin and clashes when Serial runs on UART0
[env:esp32c3]
extends = esp32_base
board = nologo_esp32c3_super_mini
build_flags = -D PIN_GPS_RX=3

; ESP32-C6 DevKitC-1: GPS TX on GPIO2, matrix DIN 19, CLK 21, CS 18
[env:esp32c6]
extends = esp32_base
board = esp32-c6-devkitc-1
build_flags = -D PIN_GPS_RX=2

; Unit tests for lib/ClockLogic on the PC: pio test -e native
[env:native]
platform = native@1.2.1
test_framework = unity
build_flags = -Wall -Wextra
lib_deps = throwtheswitch/Unity@2.6.1
